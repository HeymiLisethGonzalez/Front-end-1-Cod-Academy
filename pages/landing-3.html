<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Landing 3</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
        <!-- CSS Personalizado -->
        <link rel="stylesheet" href="../css/landing-3.css">
    </head>

    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-light bg-white shadow-sm fixed-top" id="navegacion">
            <div class="container d-flex justify-content-between align-items-center">
                <!-- Logo -->
                <a class="navbar-brand d-flex align-items-center" href="#">
                    <img src="../img/@estilo-accion.png" alt="Logo" width="40" height="40" class="me-2">
                    <span class="fw-bold text-primary fs-4">Estilo en acción</span>
                </a>
                <!-- Carrito de compras -->
                <div class="dropdown">
                    <button class="btn btn-outline-primary position-relative cart-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span id="countProductCart" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-count">
                            0
                        </span>
                    </button>
                    <!-- Dropdown del carrito -->
                    <div class="dropdown-menu dropdown-menu-end cart-dropdown shadow-lg p-0" style="width: 350px;">
                        <!-- Header del carrito -->
                        <div class="dropdown-header bg-light border-bottom">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6 class="mb-0 fw-bold text-dark">
                                    <i class="bi bi-cart3 me-2"></i>Mi Carrito
                                </h6>
                                <span class="badge bg-primary">3 items</span>
                            </div>
                        </div>
                        <!-- Lista de productos del carrito -->
                        <div class="cart-items-container" style="max-height: 300px; overflow-y: auto;">
                            <!-- Producto 1 -->
                        
                            <!-- Aqui se completa con JavaScript-->
                        </div>
                        <!-- Footer del carrito -->
                        <div class="dropdown-divider m-0"></div>
                        <div class="dropdown-item-text bg-light">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <strong class="text-dark">Total: $159.96</strong>
                            </div>
                            <div class="d-grid gap-2">
                                <button class="btn btn-primary btn-sm">
                                    <i class="bi bi-credit-card me-2"></i>Proceder al Pago
                                </button>
                                <button class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash me-2"></i>Vaciar Carrito
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Hero Section with Background Image -->
        <section class="hero-section position-relative">
            <!-- Background Image with Overlay -->
            <div class="hero-background"></div>
            <div class="hero-overlay"></div>
            <!-- Hero Content -->
            <div class="container position-relative">
                <div class="row min-vh-100 align-items-center">
                    <div class="col-lg-6 col-md-8">
                        <div class="hero-content text-white">
                            <h1 class="hero-title display-3 fw-bold mb-4">
                                Encuentra Todo Lo Que Necesitas
                            </h1>
                            <p class="hero-subtitle fs-5 mb-4 text-white-50">
                                Descubre miles de productos de alta calidad al mejor precio. Tu tienda online de confianza.
                            </p>
                            <!-- Search Form -->
                            <form class="hero-search-form" id="heroSearchForm">
                                <div class="input-group input-group-lg shadow">
                                    <input
                                        type="text"
                                        class="form-control border-0"
                                        placeholder="¿Qué estás buscando?"
                                        id="searchInput"
                                        aria-label="Buscar productos"
                                    >
                                    <button
                                        class="btn btn-primary px-4 btn-search"
                                        type="submit"
                                        id="searchBtn"
                                    >
                                        <i class="bi bi-search me-2"></i>
                                        Buscar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!--Eventos: change-->
        <select id="select-opcion">
            <option>Opcion 1</option>
            <option>Opcion 2</option>
            <option>Opcion 3</option>
            <option>Opcion 4</option>
        </select>

        <input type="checkbox">
        <input type="radio">



        <!-- Section products. -->
        <section class="products-section py-5">
            <div class="container">
                <!-- Section Header -->
                <div class="row mb-5">
                    <div class="col-12 text-center">
                        <h2 class="display-4 fw-bold mb-3">Nuestros Productos</h2>
                        <p class="lead text-muted">Descubre nuestra colección de productos de alta calidad</p>
                        <div class="divider mx-auto"></div>
                    </div>
                </div>
                <!-- Products Grid (Se llenará dinámicamente) -->
                <div class="row g-4" id="products-grid">
                    <!-- Los productos se cargarán aquí mediante JavaScript -->
                </div>
            </div>
        </section>


        <!-- Section Scroll (js) -->
        <div class="btn-scroll-top">
            <!-- <div class="icon-scroll-top">
                <i class="bi bi-arrow-up-circle" width="40" height="40" ></i>
            </div> -->
        </div>


        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <!-- JavaScript personalizado -->
        <script src="../js//landing-3/landing-3.js"></script>
        <script src="../js//landing-3/events.js"></script>
    </body>
</html>
